<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Soroban Event Indexer</title>
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    margin: 0;
    padding: 24px;
    background: #0b0f14;
    color: #d7e0ea;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .sub { color: #7d8b9a; font-size: 12px; margin-bottom: 16px; }
  .bar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
  select, button {
    background: #141b23; color: #d7e0ea; border: 1px solid #2a3542; border-radius: 6px;
    padding: 6px 10px; font: inherit;
  }
  button { cursor: pointer; }
  button:hover { border-color: #4c92ff; }
  .stat { background: #141b23; border: 1px solid #2a3542; border-radius: 8px; padding: 8px 14px; font-size: 12px; }
  .stat b { color: #4c92ff; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid #1c242e; vertical-align: top; }
  th { color: #7d8b9a; font-weight: 600; position: sticky; top: 0; background: #0b0f14; }
  tr:hover td { background: #10161d; }
  .type { color: #4c92ff; }
  .err { color: #ff6b6b; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-all; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; margin-right: 6px; }
  .dot.stale { background: #f39c12; }
</style>
</head>
<body>
  <h1>Soroban Contract Event Indexer</h1>
  <div class="sub" id="subtitle">connecting…</div>

  <div class="bar">
    <div class="stat"><span class="dot" id="live-dot"></span><span id="last-ledger">–</span> last indexed ledger</div>
    <div class="stat"><b id="total-events">–</b> events stored</div>
    <div class="stat"><b id="open-gaps">–</b> gaps recorded</div>
    <select id="type-filter"><option value="">all event types</option></select>
    <button id="refresh">refresh now</button>
    <label class="stat" style="cursor:pointer">
      <input type="checkbox" id="auto" checked style="vertical-align:middle" /> auto-refresh (3s)
    </label>
  </div>

  <table>
    <thead>
      <tr><th>Ledger</th><th>Type</th><th>Topics</th><th>Data</th><th>Tx Hash</th><th>Closed At</th></tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>

<script>
  const rowsEl = document.getElementById('rows');
  const typeFilter = document.getElementById('type-filter');
  const knownTypes = new Set();

  function fmt(v) {
    try { return typeof v === 'string' ? v : JSON.stringify(v); } catch { return String(v); }
  }

  async function refresh() {
    const type = typeFilter.value;
    const qs = new URLSearchParams({ limit: '50' });
    if (type) qs.set('type', type);

    const [eventsRes, healthRes] = await Promise.all([
      fetch('/events/latest?' + qs.toString()).then(r => r.json()).catch(() => null),
      fetch('/health').then(r => r.json()).catch(() => null),
    ]);

    if (healthRes) {
      document.getElementById('last-ledger').textContent = healthRes.lastProcessedLedger ?? 'n/a';
      document.getElementById('total-events').textContent = healthRes.totalEvents;
      document.getElementById('open-gaps').textContent = healthRes.openGaps;
      document.getElementById('subtitle').textContent = 'polling API every 3s — read-only, indexer runs separately';
      document.getElementById('live-dot').classList.remove('stale');
    } else {
      document.getElementById('live-dot').classList.add('stale');
      document.getElementById('subtitle').textContent = 'API unreachable';
    }

    if (!eventsRes) return;

    for (const e of eventsRes.events) knownTypes.add(e.type);
    const current = typeFilter.value;
    typeFilter.innerHTML = '<option value="">all event types</option>' +
      [...knownTypes].sort().map(t => `<option value="${t}">${t}</option>`).join('');
    typeFilter.value = current;

    rowsEl.innerHTML = eventsRes.events.map(e => `
      <tr>
        <td>${e.ledger}</td>
        <td class="${e.type === 'decode_error' ? 'err' : 'type'}">${e.type}</td>
        <td><pre>${fmt(e.topics)}</pre></td>
        <td><pre>${e.decodeError ? 'ERROR: ' + e.decodeError : fmt(e.data)}</pre></td>
        <td>${e.txHash ? e.txHash.slice(0, 12) + '…' : ''}</td>
        <td>${e.ledgerClosedAt ?? ''}</td>
      </tr>
    `).join('') || '<tr><td colspan="6">no events yet</td></tr>';
  }

  document.getElementById('refresh').addEventListener('click', refresh);
  typeFilter.addEventListener('change', refresh);

  let timer = null;
  function scheduleAuto() {
    if (timer) clearInterval(timer);
    if (document.getElementById('auto').checked) timer = setInterval(refresh, 3000);
  }
  document.getElementById('auto').addEventListener('change', scheduleAuto);

  refresh();
  scheduleAuto();
</script>
</body>
</html>
